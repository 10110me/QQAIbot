# 普通模式 normal；低内存模式 lowmem。修改后重新执行 python3 start.py up。
# normal 建议 8 GB RAM；lowmem 面向 1 核 1 GB，需要至少 4 GiB Swap。
[runtime]
mode = normal

# Python 与插件隔离执行；仍需群授权和操作审批。
sandbox = true

# 两种模式必须使用同一项目名才能共用数据；通常不要修改。
# 此默认名沿用 0.2.1 低内存部署的数据卷。
project = osa-lowmem

# 新 4 核 / 8 GB 服务器建议 PostgreSQL。旧安装不添加本项时沿用 SQLite。
# 变更存储需要备份与迁移，normal/lowmem 切换不改变存储。
storage = postgres

# 独立工作运行时；每个任务仍必须在后台审批后执行。
work = true
coding = builtin

# coding=builtin uses the Python generator; opencode enables isolated specialised agents.
