[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=1MB
logfile_backups=1
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1024x768x24 -nolisten tcp
autorestart=true
priority=10

[program:vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -localhost -rfbport 5900 -nopw
autorestart=true
priority=30

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=40

[program:browser-api]
command=python -m uvicorn service:create_app --factory --host 0.0.0.0 --port 8090 --no-access-log
directory=/app
environment=DISPLAY=":99"
autorestart=true
priority=50
