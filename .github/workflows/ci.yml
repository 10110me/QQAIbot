name: python
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: osa
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: osa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U osa -d osa_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python -m compileall -q src workers migrations examples scripts tests
      - run: uv run python -m unittest discover -s tests -v
        env:
          OSA_TEST_POSTGRES_URL: postgresql://osa:ci-only-test-password@127.0.0.1:5432/osa_test
      - run: uv run alembic upgrade head
        env:
          OSA_DATABASE_URL: postgresql+asyncpg://osa:ci-only-test-password@127.0.0.1:5432/osa_test
      - run: bash -n scripts/setup_swap.sh
      - run: uv run python scripts/init_env.py
      - run: docker compose -f docker-compose.lowmem.yml --profile sandbox config --quiet
      - run: OSA_DB_PASSWORD=config-validation-only docker compose -f docker-compose.yml -f docker-compose.full.yml config --quiet
      - run: uv run python start.py check
