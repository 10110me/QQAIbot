services:
  app:
    build: .
    env_file: .env
    environment:
      OSA_HOST: 0.0.0.0
      OSA_DATABASE_URL: postgresql+asyncpg://osa:${OSA_DB_PASSWORD:?Set OSA_DB_PASSWORD in .env}@postgres:5432/osa
      OSA_AUTO_CREATE_SCHEMA: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: osa
      POSTGRES_DB: osa
      POSTGRES_PASSWORD: ${OSA_DB_PASSWORD:?Set OSA_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osa -d osa"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
